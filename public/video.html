<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102747">
<title>QBOOK · Chuyển đến Quản lý Media</title>
<script>
(function(){
 var query=new URLSearchParams(window.location.search);
 var view=query.get('view')||'dashboard';
 var target=new URL('/',window.location.origin);
 target.searchParams.set('section','media');
 target.searchParams.set('view',view);
 window.location.replace(target.pathname+target.search);
})();
</script>
</head>
<body><p>Quản lý Media đã được hợp nhất vào hệ thống QBOOK. <a href="/?section=media">Mở QBOOK Quản lý Media</a>.</p></body>
</html>
