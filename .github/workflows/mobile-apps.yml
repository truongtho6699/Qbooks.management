name: Mobile apps (iOS & Android)

# The apps are a native shell around https://qbooks-quantri.pages.dev, so web changes reach
# the apps without a rebuild. Rebuild only when mobile/ changes or a new store version is needed.
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the iOS build to TestFlight (needs App Store Connect secrets)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-apps.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-apps.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  QBOOKS_VERSION_CODE: ${{ github.run_number }}
  QBOOKS_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build installable APK (debug signed)
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Build signed release (APK + AAB for Google Play)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No ANDROID_KEYSTORE_BASE64 secret: skipping release signing."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          cd android && ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/QBooks-${QBOOKS_VERSION_NAME}-cai-truc-tiep.apk"
          [ -f android/app/build/outputs/apk/release/app-release.apk ] && cp android/app/build/outputs/apk/release/app-release.apk "out/QBooks-${QBOOKS_VERSION_NAME}-release.apk" || true
          [ -f android/app/build/outputs/bundle/release/app-release.aab ] && cp android/app/build/outputs/bundle/release/app-release.aab "out/QBooks-${QBOOKS_VERSION_NAME}-google-play.aab" || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: QBooks-Android-${{ env.QBOOKS_VERSION_NAME }}
          path: mobile/out/*

  ios:
    runs-on: macos-26
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx cap sync ios
      - name: Compile for the iOS Simulator (checks the project builds; no Apple account needed)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 25
      - name: Archive and upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM_ID" ]; then echo "::error::Missing App Store Connect secrets (see mobile/README.md)"; exit 1; fi
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"; printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/QBooks.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$QBOOKS_VERSION_CODE" MARKETING_VERSION="$QBOOKS_VERSION_NAME" \
            $AUTH archive | tail -n 25
          cat > build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/QBooks.xcarchive -exportOptionsPlist build/export.plist \
            -exportPath build/export $AUTH | tail -n 25
          echo "Uploaded build ${QBOOKS_VERSION_NAME} (${QBOOKS_VERSION_CODE}) to App Store Connect → TestFlight."
